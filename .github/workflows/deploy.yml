name: Deploy to Vercel

# Автодеплой: каждый пуш в main публикует игру на Vercel (production).
# Нужен один секрет репозитория: VERCEL_TOKEN (или VERCEL)
# (GitHub → Settings → Secrets and variables → Actions → New repository secret).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL }}
      VERCEL_PROJECT: snaky-io
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Секрет VERCEL_TOKEN не задан — деплой пропущен."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Link project
        if: steps.token.outputs.ok == 'true'
        run: npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Игра опубликована: $url"
          echo "### 🐍 Игра опубликована: $url" >> "$GITHUB_STEP_SUMMARY"
