<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080F1A">
  <title>Snaky.io — неоновая змейка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Общие градиенты для декоративных волн -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="wg1" x1="0" x2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
      <linearGradient id="wg2" x1="1" x2="0"><stop offset="0" stop-color="#C026D3"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient>
    </defs>
  </svg>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hud" hidden>
    <div class="hud-left">
      <div class="card score-card">
        <div class="score-line">Счёт: <b id="hud-score">0</b></div>
        <div class="length-line">Длина: <b id="hud-length">0</b></div>
      </div>
      <button id="pause-btn" class="icon-btn" aria-label="Пауза">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="card board-card">
      <div class="board-title">Топ игроков</div>
      <ol id="hud-board" class="board-list"></ol>
    </div>
  </div>

  <!-- ===== Сенсорное управление ===== -->
  <div id="touch" class="touch" hidden>
    <div id="joy-zone" class="joy-zone">
      <div id="joy-base" class="joy-base"><div id="joy-knob" class="joy-knob"></div></div>
    </div>
    <button id="boost-btn" class="boost-btn" aria-label="Ускорение">
      <svg viewBox="0 0 24 24" width="34" height="34"><path d="M13.5 2 4 14h7l-1.5 8L20 10h-7l.5-8z" fill="currentColor"/></svg>
    </button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- ===== Главное меню ===== -->
  <section id="menu" class="screen">
    <div class="modal menu-modal">
      <svg class="waves" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 120 C 60 60, 120 200, 200 150 S 330 60, 400 110 L400 200 L0 200Z" fill="url(#wg1)" opacity=".35"/>
        <path d="M0 160 C 90 110, 150 210, 250 170 S 360 120, 400 150 L400 200 L0 200Z" fill="url(#wg2)" opacity=".35"/>
      </svg>

      <div class="mascot" aria-hidden="true">
        <svg viewBox="0 0 120 90" width="120" height="90">
          <defs>
            <radialGradient id="mg" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#D8B4FE"/><stop offset="1" stop-color="#7C3AED"/></radialGradient>
          </defs>
          <circle cx="22" cy="68" r="11" fill="#6D28D9"/>
          <circle cx="38" cy="62" r="14" fill="#7C3AED"/>
          <circle cx="68" cy="45" r="30" fill="url(#mg)"/>
          <circle cx="58" cy="38" r="10" fill="#fff"/><circle cx="82" cy="38" r="10" fill="#fff"/>
          <circle cx="61" cy="39" r="5" fill="#0B1020"/><circle cx="85" cy="39" r="5" fill="#0B1020"/>
          <circle cx="63" cy="37" r="1.6" fill="#fff"/><circle cx="87" cy="37" r="1.6" fill="#fff"/>
        </svg>
      </div>
      <h1 class="logo">SNAKY<span>.IO</span></h1>

      <input id="name-input" class="text-input" maxlength="16" placeholder="Введите имя" autocomplete="off" spellcheck="false">
      <button id="play-btn" class="btn btn-primary btn-wide">Играть</button>
      <div class="btn-row">
        <button id="menu-settings-btn" class="btn btn-secondary">Настройки</button>
        <button id="exit-btn" class="btn btn-ghost">Выход</button>
      </div>
      <p class="best-line">Лучший счёт: <b id="best-score">0</b></p>
    </div>
    <p class="hint">Мышь — направление · ЛКМ / пробел — ускорение · Esc — пауза</p>
  </section>

  <!-- ===== Пауза ===== -->
  <section id="pause" class="screen" hidden>
    <div class="modal">
      <button id="pause-close" class="close-btn" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <h2>Пауза</h2>
      <div class="btn-col">
        <button id="resume-btn" class="btn btn-primary">Продолжить</button>
        <button id="pause-settings-btn" class="btn btn-secondary">Настройки</button>
        <button id="pause-menu-btn" class="btn btn-secondary">Главное меню</button>
      </div>
    </div>
  </section>

  <!-- ===== Игра окончена ===== -->
  <section id="gameover" class="screen" hidden>
    <div class="modal">
      <svg class="waves" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 120 C 60 60, 120 200, 200 150 S 330 60, 400 110 L400 200 L0 200Z" fill="url(#wg1)" opacity=".3"/>
        <path d="M0 160 C 90 110, 150 210, 250 170 S 360 120, 400 150 L400 200 L0 200Z" fill="url(#wg2)" opacity=".3"/>
      </svg>
      <h2>Игра окончена</h2>
      <p id="go-reason" class="muted"></p>
      <div class="stats-grid">
        <div><span>Твой счёт</span><b id="go-score">0</b></div>
        <div><span>Твоя длина</span><b id="go-length">0</b></div>
        <div><span>Победы</span><b id="go-kills">0</b></div>
      </div>
      <p id="go-record" class="record" hidden>🏆 Новый рекорд!</p>
      <div class="btn-col">
        <button id="again-btn" class="btn btn-primary">Играть снова</button>
        <button id="go-menu-btn" class="btn btn-secondary">Главное меню</button>
      </div>
      <div id="world-top" class="world-top" hidden>
        <div class="board-title">Мировой рейтинг</div>
        <ol id="world-board" class="board-list"><li class="muted">Загрузка…</li></ol>
      </div>
    </div>
  </section>

  <!-- ===== Настройки ===== -->
  <section id="settings" class="screen" hidden>
    <div class="modal">
      <button id="settings-close" class="close-btn" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <h2>Настройки</h2>
      <div class="setting">
        <div class="setting-label">Скин змейки</div>
        <div id="skins" class="skins"></div>
      </div>
      <label class="toggle"><span>Эффекты свечения</span><input type="checkbox" id="opt-glow"><i></i></label>
      <label class="toggle"><span>Имена соперников</span><input type="checkbox" id="opt-names"><i></i></label>
      <button id="settings-done" class="btn btn-primary">Готово</button>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
